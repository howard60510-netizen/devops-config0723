apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-demo0723
  labels:
    app: devops-demo0723
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-demo0723
  template:
    metadata:
      labels:
        app: devops-demo0723
    spec:
      containers:
        - name: devops-demo0723
          image: ghcr.io/howard60510-netizen/devops-demo0723:f513e5dfe6ffea34f5b6f1fdf8f413155fc2809a
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
